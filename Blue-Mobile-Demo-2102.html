<!doctype html><html lang="bg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#00ade6"><title>ОББ банкиране</title><style>
:root{--blue:#00afe8;--navy:#073b64;--muted:#587da0;--pale:#f0f9fd;--line:#d9e8f1}*{box-sizing:border-box}body{margin:0;background:#eaf2f7;color:var(--navy);font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible{outline:3px solid #00afe8;outline-offset:3px}.app{max-width:480px;margin:auto;background:white;min-height:100dvh;position:relative;padding-bottom:100px;box-shadow:0 0 60px #2102}.demo{font-size:10px;letter-spacing:1.6px;text-align:center;background:#e9f7fc;color:#38708d;padding:8px;font-weight:bold}.head{display:flex;align-items:center;gap:10px;padding:22px 18px}.avatar{background:#f1f7f9;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}.assistant{border:1px solid #c9d8e3;border-radius:30px;flex:1;padding:10px 12px;display:flex;justify-content:space-between;font-size:12px}.assistant b{font-size:16px;color:#122d51}.icon{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.head>button:last-child{color:var(--blue)}h1{font-size:23px;margin:10px 0 24px}h2{font-size:20px}p{line-height:1.5}.content{padding:0 18px}.tabs{display:flex;gap:9px;margin:2px 0 24px}.pill{padding:11px 18px;border-radius:28px;background:var(--pale);border:1px solid #d6e7fa}.pill.active{background:#102e53;color:white;border-color:#102e53}.total{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.total strong{font-size:26px;display:block;margin-top:6px}.carousel{display:flex;gap:13px;overflow:auto;margin:0 -18px;padding:0 18px 12px;scroll-snap-type:x mandatory}.account{flex:0 0 191px;border:1px solid #d5e6fc;border-radius:10px;overflow:hidden;text-align:left;padding:0;scroll-snap-align:center}.account.selected{outline:2px solid var(--blue);outline-offset:-2px}.art{height:109px;background-color:#06b3e8;background-image:conic-gradient(from 35deg at 70% 40%,#13b1e5 0 60deg,#5dcef0 60deg 120deg,#24b8e7 120deg 180deg,#70d4f2 180deg 240deg,#48c6ee 240deg 300deg,#00afe5 300deg);display:grid;place-items:center;color:white}.art .icon{width:48px;height:48px;stroke-width:1.2}.account-body{padding:12px 10px 14px}.account-body small{display:block;margin:9px 0;color:var(--muted);font-size:11px}.account-body strong{font-size:21px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;color:var(--blue);font-size:15px}.tx{display:flex;align-items:center;width:100%;gap:12px;padding:15px 0;text-align:left;border-bottom:1px solid #f1f5f7}.tx .bubble{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pale);display:grid;place-items:center;color:var(--muted)}.tx .desc{flex:1;min-width:0}.tx b{font-size:13px;display:block;line-height:1.4}.tx small{display:block;font-size:11px;color:var(--muted);margin-top:6px}.tx .amount{text-align:right;white-space:nowrap}.positive{color:#248667}.promo{background:#e5f8fe;border:1px solid #c6edfa;border-radius:12px;padding:20px;margin:24px 0;position:relative;overflow:hidden}.promo:after{content:'↗';position:absolute;font-size:100px;color:#b5ebfa;right:6px;top:-8px}.promo h2{margin:0 0 8px;position:relative;z-index:1}.primary{display:block;width:100%;background:var(--blue);color:white;border-radius:25px;padding:14px;font-weight:bold}.promo button{width:auto;padding:9px 22px;margin-top:15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eef3f6;display:flex;padding:12px 5px max(18px,env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:8px}.nav button.active{color:#102e53;font-weight:bold}.nav .icon{width:25px;height:25px}.panel{border-radius:12px;background:#fff;box-shadow:0 4px 15px #123b6412;padding:18px;margin:14px 0;border:1px solid #eef3f6}.product{display:flex;text-align:left;width:100%;gap:14px}.mini{width:47px;height:47px;border-radius:10px;flex:none}.mini .icon{width:28px;height:28px}.product strong{display:block;margin-top:13px}.product small{display:block;color:var(--muted);margin-top:10px;font-size:11px}.menu{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:22px 2px;font-size:17px}.menu>.icon{color:var(--muted);flex:none}.menu span{flex:1}.menu small{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.menu em{font-style:normal;color:var(--muted)}.card{background:linear-gradient(120deg,#102e53,#167caa);border-radius:16px;color:white;padding:22px;margin:20px 0}.card .number{font-size:20px;letter-spacing:3px;margin:28px 0 18px}.card footer{display:flex;justify-content:space-between;font-size:12px}.overlay{position:fixed;inset:0;background:#092d5166;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88dvh;overflow:auto;padding:22px 24px 32px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:18px}.close{font-size:28px;color:var(--blue)}label{display:block;font-size:13px;margin:18px 0 7px}input,select{width:100%;border:1px solid #cfdee8;border-radius:9px;padding:13px;color:var(--navy);background:white}input:focus{outline:2px solid var(--blue)}.hint{font-size:12px;color:var(--muted)}.error{font-size:13px;color:#b33342}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf2f6;font-size:13px}.row b{text-align:right}.sheet .primary{margin-top:24px}.success{text-align:center;padding:18px 0}.check{width:65px;height:65px;background:#e7f7ef;color:#24936a;display:grid;place-items:center;border-radius:50%;font-size:32px;margin:0 auto 20px}.login{background:linear-gradient(155deg,#00afe5,#0088ba);min-height:100dvh;text-align:center;color:white}.login .demo{background:#ffffff20;color:white}.brand{padding:45px 20px 22px;font-size:36px;font-weight:bold;letter-spacing:-1px}.brand .icon{display:block;margin:0 auto 15px;width:50px;height:50px}.brand small{display:block;font-size:15px;letter-spacing:3px;margin-top:8px}.welcome{font-size:37px;margin:18px 0 28px;letter-spacing:-1px}.login-sheet{background:white;color:var(--navy);border-radius:22px 22px 0 0;padding:24px 30px 32px;min-height:440px}.login-sheet h2{margin:0 0 10px;font-size:19px}.dots{height:40px;display:flex;gap:14px;justify-content:center;align-items:center}.dot{border:1px solid #91adc2;width:11px;height:11px;border-radius:50%}.dot.filled{background:var(--blue);border-color:var(--blue)}.keys{display:grid;grid-template-columns:repeat(3,1fr);max-width:280px;margin:16px auto;gap:14px 26px}.key{border:1px solid #99b2c8;border-radius:50%;aspect-ratio:1;font-size:25px;color:#527b9c}.key.soft{background:#eff5f8;border:0}.skip{font-size:13px;color:#008dc2;text-decoration:underline;padding:10px}.badge{font-size:10px;padding:5px 8px;background:#e8f5ff;border-radius:5px;color:#3586ae}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#123b64;color:#fff;border-radius:12px;padding:13px 20px;z-index:40;max-width:90%;font-size:13px;box-shadow:0 5px 25px #0002}.search{margin:4px 0 10px}.empty{padding:35px 10px;text-align:center;color:var(--muted)}@media(min-width:650px){.app{margin:25px auto;min-height:calc(100dvh - 50px);border-radius:20px;overflow:hidden}.nav{bottom:25px;border-radius:0 0 20px 20px}.login{min-height:calc(100dvh - 50px)}.sheet{border-radius:20px;margin-bottom:35px}.login-sheet{padding-bottom:40px}}
</style></head><body><div id="app" class="app"></div><div id="modal"></div><div id="toast" hidden></div><script>
const paths={home:'M3 10 12 3 21 10M5 9v12h5v-7h4v7h5V9',wallet:'M4 7V5l13-3v5M4 7h15a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2ZM17 13h1',transfer:'M3 7h17m-5-5 5 5-5 5M21 17H4m5-5-5 5 5 5',list:'M9 4h12M9 12h12M9 20h12M3 4h1M3 12h1M3 20h1',water:'M12 2S5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13Z',more:'M3 5h18M3 12h18M3 19h18',bell:'M5 17h14l-2-4V9a5 5 0 0 0-10 0v4l-2 4ZM10 21h4',user:'M16 6a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 22v-3c0-7 16-7 16 0v3Z',card:'M3 4h18v16H3ZM3 9h18M6 15h4',eye:'M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12ZM16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',car:'M3 15V9h18v6M5 9l2-5h10l2 5M4 15h16v5h-3v-3H7v3H4Z'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.wallet}"/></svg>`;
const fresh=()=>({balances:[155345,52833438],tx:[{a:0,name:'Бонус',note:'VMB IT EOOD',amount:40000000,date:'29/10'},{a:1,name:'Прехвърлени средства  ',note:'Начален баланс',amount:5455577,date:''}],paid:false,frozen:false});let data;try{data=JSON.parse(localStorage.getItem('blue-demo-v1'))||fresh()}catch{data=fresh()}let page='home',selected=0,hidden=false,pin='',logged=false,filter='';const names=['Разплащателна сметка','Спестовна сметка'],ids=['BG85 •• 9550','BG85 •• 0706'];const money=n=>hidden?'•••••• EUR':new Intl.NumberFormat('bg-BG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100)+' EUR';const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('blue-demo-v1',JSON.stringify(data))}catch(e){/* Continue in memory when local file storage is unavailable. */}}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,3000)}function closeModal(){document.getElementById('modal').innerHTML=''}function sheet(title,body){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><b>${title}</b><button class="close" onclick="closeModal()" aria-label="Затвори">×</button></div>${body}</section></div>`}function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="demo"></div><div class="brand">${icon('wallet')}ОББ<small>МОБАЙЛ</small></div><h1 class="welcome">Твоят ден.<br>Твоите възможности.</h1><div class="login-sheet"><h2>Вход в ОББ Мобайл</h2><p class="hint"></p><div class="dots">${[0,1,2,3].map(i=>`<span class="dot ${i<pin.length?'filled':''}"></span>`).join('')}</div><div class="keys">${['1','2','3','4','5','6','7','8','9','⌫','0','✓'].map(k=>`<button class="key ${isNaN(k)?'soft':''}" onclick="key('${k}')" aria-label="${k==='⌫'?'Изтрий':k==='✓'?'Вход':k}">${k}</button>`).join('')}</div><button class="skip" onclick="enter()"></button><p class="hint"></p></div></div>`}function key(k){if(k==='⌫')pin=pin.slice(0,-1);else if(k==='✓'){if(pin==='2102')return enter();toast('Грешен PIN');pin=''}else if(pin.length<4)pin+=k;login()}function enter(){logged=true;page='home';render()}function go(p){page=p;filter='';render();window.scrollTo(0,0)}function txhtml(t,i){return `<button class="tx" onclick="txdetail(${i})"><span class="bubble">${icon('transfer')}</span><span class="desc"><b>${escape(t.name)}</b><small>${escape(t.note)}</small></span><span class="amount"><b class="${t.amount>0?'positive':''}">${hidden?'':t.amount>0?'+':''}${money(t.amount)}</b><small>${t.date}</small></span></button>`}function transactions(){let ts=data.tx.map((t,i)=>({t,i})).filter(({t})=>t.a===selected&&(!filter||t.name.toLowerCase().includes(filter.toLowerCase())||t.note.toLowerCase().includes(filter.toLowerCase())));return ts.length?ts.map(({t,i})=>txhtml(t,i)).join(''):'<div class="empty">Няма намерени транзакции.</div>'}function accounts(){return names.map((n,i)=>`<button class="account ${i===selected?'selected':''}" onclick="selected=${i};render()"><div class="art">${icon('wallet')}</div><div class="account-body">${i===0?'Разплащателна':'Спестовна'}<small>${ids[i]}</small><strong>${money(data.balances[i])}</strong></div></button>`).join('')}function menu(text,ic,action,sub=''){return `<button class="menu" onclick="${action}">${icon(ic)}<span>${text}${sub?`<small>${sub}</small>`:''}</span><em>›</em></button>`}function render(){if(!logged)return login();let body='';if(page==='home')body=`<div class="tabs"><button class="pill active">${icon('wallet')} Начало</button><button class="pill" onclick="info('На път','Център за пътувания, застраховки и автомобилни услуги.')">${icon('car')} На път</button></div><div class="total"><div><span class="eyebrow">Обща наличност</span><strong>${money(data.balances.reduce((a,b)=>a+b,0))}</strong></div><button aria-label="Скрий или покажи балансите" onclick="hidden=!hidden;render()">${icon('eye')}</button></div><div class="carousel">${accounts()}</div><div class="section-title"><span>Последни транзакции</span><button onclick="details(selected)">Детайли ›</button></div>${transactions()}<div class="promo"><h2>Повече възможности.</h2><div class="hint">Две сметки. Всичко на едно място.</div><button class="primary" onclick="transfer('own')">Направи демо превод</button></div>`;
if(page==='products')body=`<h1>Сметки <span class="badge" style="float:right">2 активни</span></h1>${names.map((n,i)=>`<button class="panel product" onclick="details(${i})"><div class="art mini">${icon('wallet')}</div><div>${n}<small>${ids[i]} · EUR</small><strong>${money(data.balances[i])}</strong></div></button>`).join('')}<h2 style="margin-top:30px">Карти</h2><div class="card"><div>BLUE <span style="float:right">DEBIT</span></div><div class="number">•••• •••• •••• </div><footer><span>MASTER CARD</span><b>mastercard</b></footer></div><button class="pill" onclick="data.frozen=!data.frozen;save();render();toast(data.frozen?'Картата е замразена':'Картата е активна')">${data.frozen?'Размрази карта':'Замрази карта'}</button><p class="hint">${data.frozen?'Замразена':'Активна'} · Свързана с разплащателната сметка</p>`;
if(page==='transfers')body=`<h1>Преводи</h1>${menu('Превод по мобилен номер','user',"transfer('phone')")}${menu('Между собствени сметки','user',"transfer('own')")}${menu('Превод по сметка','transfer',"transfer('external')",'Симулирай евров превод')}${menu('Неосчетоводени плащания','list',"info('Неосчетоводени плащания','Няма чакащи плащания. Демо преводите се осчетоводяват веднага.')")}${menu('Шаблони','list',"info('Шаблони','Нямаш запазени шаблони в тази демо сесия.')")}<p class="hint">Всички преводи са симулации. Не се изпращат реални средства.</p>`;
if(page==='bills')body=`<h1>Битови сметки</h1><div class="panel"><div class="eyebrow"></div><h2></h2><p></p><h2></h2><button class="primary" ${data.paid?'disabled':''} onclick="bill()">${data.paid?'Платено ✓':'Плати'}</button></div><p class="hint">.</p>`;
if(page==='more')body=`<h1>Повече</h1><div class="panel product"><div class="avatar">ЕБ</div><div><b>Евелина Братанова</b><small>Клиентски профил</small></div></div>${menu('За мобайл','wallet',"info('ОББ Мобайл','')")}${menu('','transfer',"resetDialog()")}${menu('Изход','user',"logged=false;pin='';login()")}`;
document.getElementById('app').innerHTML=`<div class="demo"> СРЕДСТВА · ОББ Мобайл</div><header class="head"><button class="avatar" onclick="go('more')">ЕБ</button><button class="assistant" onclick="help()"><span>Как да ви помогна?</span><b>Blue</b></button><button aria-label="Известия" onclick="">${icon('bell')}</button></header><main class="content">${body}</main><nav class="nav">${[['home','home','Начало'],['products','list','Продукти'],['transfers','transfer','Преводи'],['bills','water','Битови'],['more','more','Повече']].map(([p,i,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${icon(i)}${n}</button>`).join('')}</nav>`}
function info(title,text){sheet(title,`<p>${text}</p><button class="primary" onclick="closeModal()">Разбрах</button>`)}function help(){sheet('Как можем да помогнем?',menu('Виж сметките','wallet',"closeModal();go('products')")+menu('Направи превод','transfer',"transfer('own')")+menu('Битови сметки','water',"closeModal();go('bills')"))}function details(i){selected=i;sheet(names[i],`<div class="eyebrow">Наличност </div><h1>${money(data.balances[i])}</h1><div class="row"><span>Номер</span><b>${ids[i]}</b></div><div class="row"><span>Титуляр</span><b>Евелина Братанова</b></div><div class="row"><span>Валута</span><b>EUR</b></div><button class="primary" onclick="transfer('own')">Превод</button><button class="skip" onclick="closeModal();go('history')">Виж историята →</button>`)}const baseRender=render;render=function(){baseRender();if(page==='history'&&logged){document.querySelector('main').innerHTML=`<h1>История на сметката</h1><select onchange="selected=+this.value;render()">${names.map((n,i)=>`<option value="${i}" ${selected===i?'selected':''}>${n}</option>`).join('')}</select><input class="search" placeholder="Търси транзакции" aria-label="Търси транзакции" oninput="filter=this.value;document.getElementById('results').innerHTML=transactions()"><div id="results">${transactions()}</div>`}};function txdetail(i){let t=data.tx[i];sheet('Детайли на транзакция',`<h1>${money(t.amount)}</h1><div class="row"><span>Контрагент</span><b>${escape(t.name)}</b></div><div class="row"><span>Основание</span><b>${escape(t.note)}</b></div><div class="row"><span>Дата</span><b>${t.date}/2026</b></div><div class="row"><span>Статус</span><b>Изпълнена ·</b></div><p class="hint"></p>`)}
let pending=null;function transfer(type){sheet(type==='own'?'Между собствени сметки':type==='phone'?'Превод по мобилен номер':'Превод по сметка',`<form id="transferform"><label>От сметка</label><select id="from">${names.map((n,i)=>`<option value="${i}" ${selected===i?'selected':''}>${n} · ${money(data.balances[i])}</option>`).join('')}</select>${type==='own'?`<label>Към сметка</label><select id="to">${names.map((n,i)=>`<option value="${i}" ${selected!==i?'selected':''}>${n}</option>`).join('')}</select>`:`<label>Демо получател</label><input id="recipient" required value="получател" maxlength="80"><label>${type==='phone'?'телефон':'номер на сметка'}</label><input id="destination" required value="${type==='phone'?'0888-000-000':'ACCOUNT-001'}" maxlength="40"><p class="hint">Използвай само примерни данни.</p>`}<label>Сума в EUR</label><input id="amount" inputmode="decimal" placeholder="0,00" required><label>Основание</label><input id="note" value="превод" maxlength="100" required><p class="error" id="err"></p><button class="primary" type="submit">Продължи</button><p class="hint"></p></form>`);document.getElementById('transferform').onsubmit=e=>{e.preventDefault();let from=+document.getElementById('from').value,to=type==='own'?+document.getElementById('to').value:null,raw=document.getElementById('amount').value.trim().replace(',','.'),amount=Math.round(Number(raw)*100),err='';if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(amount)||amount<=0)err='Въведи валидна положителна сума с до 2 знака.';else if(from===to)err='Избери две различни сметки.';else if(amount>data.balances[from])err='Недостатъчна наличност.';if(err){document.getElementById('err').textContent=err;return}pending={from,to,amount,name:to===null?document.getElementById('recipient').value:names[to],note:document.getElementById('note').value};sheet('Потвърди превод',`<h1>${money(amount)}</h1><div class="row"><span>От</span><b>${names[from]}</b></div><div class="row"><span>Към</span><b>${escape(pending.name)}</b></div><div class="row"><span>Основание</span><b>${escape(pending.note)}</b></div><div class="row"><span>Такса</span><b>0,00 EUR</b></div><button class="primary" onclick="confirmTransfer()">Потвърди </button>`)};}function confirmTransfer(){if(!pending)return;let p=pending;pending=null;if(p.amount>data.balances[p.from])return info('Недостатъчна наличност','Преводът не беше изпълнен.');data.balances[p.from]-=p.amount;let date=new Intl.DateTimeFormat('bg-BG',{day:'2-digit',month:'2-digit'}).format(new Date()).replace(/\./g,'/').replace(/\/$/,'');data.tx.unshift({a:p.from,name:p.name,note:p.note,amount:-p.amount,date});if(p.to!==null){data.balances[p.to]+=p.amount;data.tx.unshift({a:p.to,name:names[p.from],note:p.note,amount:p.amount,date})}save();render();sheet('Готово',`<div class="success"><div class="check">✓</div><h2>преводът е изпълнен</h2><h1>${money(p.amount)}</h1><p class="hint">Балансите и историята са обновени.<br>Не са изпратени средства.</p><button class="primary" onclick="closeModal();go('home')">Към начало</button></div>`)}function bill(){if(data.paid)return;pending={from:0,to:null,amount:8640,name:'Електроенергия',note:'Битова сметка'};sheet('Потвърди плащане',`<h1>86,40 EUR</h1><p>От разплащателната демо сметка.</p><button class="primary" onclick="payBill()">Плати</button>`)}function payBill(){if(data.balances[0]<8640)return info('Недостатъчна наличност','Захрани разплащателната сметка с демо превод.');data.paid=true;confirmTransfer()}function resetDialog(){sheet('',`<p></p><button class="primary" onclick="data=fresh();save();closeModal();go('home');toast('Демо данните са възстановени')"></button>`)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(!logged){if(/^\d$/.test(e.key))key(e.key);if(e.key==='Backspace')key('⌫');if(e.key==='Enter')key('✓')}});render();
</script></body></html>
